<script>
  init({
    title: 'Export beforeExport',
    desc: 'Test the beforeExport option.',
    links: [
      'bootstrap-table.min.css'
    ],
    scripts: [
      'bootstrap-table.min.js',
      'extensions/export/bootstrap-table-export.min.js'
    ]
  })
</script>

<table id="table">
  <thead>
    <tr>
      <th data-field="id">ID</th>
      <th data-field="name">Name</th>
      <th data-field="price">Price</th>
    </tr>
  </thead>
</table>

<script>
  function mounted () {
    $('#table').bootstrapTable({
      showExport: true,
      data: [
        { id: 1, name: 'Item 1', price: '$1' },
        { id: 2, name: 'Item 2', price: '$2' }
      ],
      beforeExport (data, type) {
        window._beforeExport = { data, type }
        return false
      }
    })

    $('#table').on('export-started.bs.table', function () {
      window._exportStarted = true
    })
    $('#table').on('export-saved.bs.table', function () {
      window._exportSaved = true
    })
  }
</script>
