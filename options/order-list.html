<script>
init({
  title: 'Order List',
  desc: 'Use the table-level `orderList` option to control the sort-direction cycle of all sortable columns. Here `orderList: \'desc,asc\'` is set globally, so the first click on any column header sorts descending. Related to #7477.',
  links: ['bootstrap-table.min.css'],
  scripts: ['bootstrap-table.min.js']
})
</script>

<template>
  <table id="table"></table>
</template>

<script>
function mounted () {
  $('#table').bootstrapTable({
    orderList: 'desc,asc',
    data: [
      { id: 1, name: 'Item 1', date: '2024-01-15', price: 30 },
      { id: 2, name: 'Item 2', date: '2025-06-02', price: 10 },
      { id: 3, name: 'Item 3', date: '2023-11-20', price: 50 },
      { id: 4, name: 'Item 4', date: '2025-12-08', price: 20 },
      { id: 5, name: 'Item 5', date: '2024-09-30', price: 40 }
    ],
    columns: [
      { field: 'id', title: 'ID', sortable: true },
      { field: 'name', title: 'Item Name', sortable: true },
      { field: 'date', title: 'Date', sortable: true },
      { field: 'price', title: 'Item Price', sortable: true }
    ]
  })
}
</script>
