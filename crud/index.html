<!DOCTYPE html>
<html>
<head>
  <title>CRUD Table</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-table@1.27.3/dist/bootstrap-table.min.css">
  <style>
    .alert {
      padding: 0 14px;
      margin-bottom: 0;
      display: inline-block;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-table@1.27.3/dist/bootstrap-table.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>CRUD Table</h1>
    <p class="toolbar">
      <a class="create btn btn-secondary" href="javascript:">Create Item</a>
      <span class="alert"></span>
    </p>
    <table id="table"></table>
  </div>

  <div id="modal" class="modal fade">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label>Name</label>
            <input type="text" class="form-control" name="name" placeholder="Name">
          </div>
          <div class="mb-3">
            <label>Stars</label>
            <input type="number" class="form-control" name="stargazers_count" placeholder="Stars">
          </div>
          <div class="mb-3">
            <label>Forks</label>
            <input type="number" class="form-control" name="forks_count" placeholder="Forks">
          </div>
          <div class="mb-3">
            <label>Description</label>
            <textarea class="form-control" name="description" placeholder="Description"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary submit">Submit</button>
        </div>
      </div><!-- /.modal-content -->
    </div><!-- /.modal-dialog -->
  </div><!-- /.modal -->

<script>
  const API_URL = 'http://localhost:3001/list/'
  const $table = $('#table')
  const modal = new bootstrap.Modal('#modal')
  const $alert = $('.alert').hide()

  function showModal (title, row_) {
    const row = row_ || {
      id: '',
      name: '',
      stargazers_count: 0,
      forks_count: 0,
      description: ''
    } // default row value

    $('#modal').data('id', row.id)
    $('#modal').find('.modal-title').text(title)
    for (const name in row) {
      if (!Object.prototype.hasOwnProperty.call(row, name)) continue
      $('#modal').find(`[name="${name}"]`).val(row[name])
    }
    modal.show()
  }

  function showAlert (title, type) {
    $alert.attr('class', `alert alert-${type || 'success'}`)
      .html(`<i class="bi bi-check-lg"></i> ${title}`).show()
    setTimeout(function () {
      $alert.hide()
    }, 3000)
  }

  $(function () {
    $table.bootstrapTable({
      url: API_URL,
      showRefresh: true,
      showColumns: true,
      search: true,
      toolbar: '.toolbar',
      queryParams () {
        return {}
      },
      columns: [
        {
          field: 'name',
          title: 'Name'
        },
        {
          field: 'stargazers_count',
          title: 'Stars'
        },
        {
          field: 'forks_count',
          title: 'Forks'
        },
        {
          field: 'description',
          title: 'Description'
        },
        {
          field: 'action',
          title: 'Action',
          align: 'center',
          formatter: () => [
            '<a class="update me-2" href="javascript:" title="Update Item"><i class="bi bi-pencil"></i></a>',
            '<a class="remove" href="javascript:" title="Delete Item"><i class="bi bi-trash"></i></a>'
          ].join(''),
          events: {
            'click .update' (e, value, row) {
              showModal($(e.currentTarget).attr('title'), row)
            },
            'click .remove' (e, value, row) {
              if (confirm('Are you sure to delete this item?')) {
                $.ajax({
                  url: API_URL + row.id,
                  type: 'delete',
                  success () {
                    $table.bootstrapTable('refresh')
                    showAlert('Delete item successful!', 'success')
                  },
                  error () {
                    showAlert('Delete item error!', 'danger')
                  }
                })
              }
            }
          }
        }
      ]
    })

    // create event
    $('.create').click(function () {
      showModal($(this).text())
    })

    $('#modal').find('.submit').click(function () {
      const row = {}

      $('#modal').find('input[name], textarea[name]').each(function () {
        const name = $(this).attr('name')
        const value = $(this).val()

        if ($(this).attr('type') === 'number') {
          row[name] = value === '' ? null : +value
        } else {
          row[name] = value
        }
      })

      $.ajax({
        url: API_URL + ($('#modal').data('id') || ''),
        type: $('#modal').data('id') ? 'put' : 'post',
        contentType: 'application/json',
        data: JSON.stringify(row),
        success () {
          modal.hide()
          $table.bootstrapTable('refresh')
          showAlert(`${$('#modal').data('id') ? 'Update' : 'Create'} item successful!`, 'success')
        },
        error () {
          modal.hide()
          showAlert(`${$('#modal').data('id') ? 'Update' : 'Create'} item error!`, 'danger')
        }
      })
    })
  })
</script>
</body>
</html>
